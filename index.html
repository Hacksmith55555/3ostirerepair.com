<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3os Tire Repair</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar" aria-label="Main header">
        <button class="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu" type="button">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="brand" aria-label="3os Tire Repair logo">
          <img src="3ostirerepairLogo.png" alt="3os Tire Repair logo" />
        </div>
      </header>

      <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

      <main>
        <section class="hero">
          <div class="hero-inner">
            <h2 class="headline">Tire Repair Service - Local Tire Repair Weatherford, OK</h2>
            <p class="subhead">Your trusted, affordable Weatherford tire repair, serving Weatherford and surrounding areas.</p>

            <a class="cta" href="tel:4056554954" aria-label="Call 405-655-4954">
              <span class="phone" aria-hidden="true"></span>
              <span>405-655-4954</span>
            </a>
          </div>
        </section>

        <section class="form-panel">
          <div class="panel-card">
            <h2>Get A Quick Call Back</h2>

            <form class="form-grid">
              <input class="field" type="text" placeholder="First Name" aria-label="First name" />
              <input class="field" type="text" placeholder="Last Name" aria-label="Last name" />
              <input class="field" type="email" placeholder="Email" aria-label="Email" />
              <input class="field" type="tel" placeholder="Phone Number" aria-label="Phone number" />
              <textarea class="field full" rows="4" placeholder="How can we help?" aria-label="How can we help?"></textarea>
              <button class="submit-btn" type="submit">Submit</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
